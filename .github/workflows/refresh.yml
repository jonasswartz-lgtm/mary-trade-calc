name: Refresh projections and deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ESPN projections
        env:
          LEAGUE_ID: "1501218329"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        shell: bash
        run: python -u scripts/fetch_espn.py 2>&1 | tee data_log.txt
      - name: Encrypt data and assemble site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          pip install -q cryptography
          python scripts/encrypt.py
          cp index.html _site/
      - name: Save snapshot to data branch
        run: |
          mkdir -p /tmp/snap && cp data_log.txt /tmp/snap/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin data || true
          git checkout --orphan data-tmp
          git rm -rfq . || true
          cp /tmp/snap/* .
          git add data_log.txt
          git commit -qm "Fetch log"
          git push -f origin data-tmp:data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
